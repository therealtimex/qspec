# Paperforge project for the QSPEC documents rendered by `qspec render`.
# Keep process records unpublished; dossiers build in draft mode because an
# attached note may honestly contain a marker that the publication gate flags.
[defaults]
profile = "en"
organisation = "RealTimeX"
publisher = "RealTimeX Research"
paper = "A4"

[types.qspec-sheet]
layout = "brief"
bibliography = "references.bib"
citation_style = "apa"

[types.qspec-index]
layout = "brief"

[types.qspec-dossier]
extends = "report"
bibliography = "references.bib"
citation_style = "apa"

[[collection]]
slug = "qspec-dossiers"
root = "dossiers"
profile = "en"

  [[collection.document]]
  id = "qspec-dossier-q-001"
  type = "qspec-dossier"
  source = "Q-001.md"
  pdf = "typst"
  docx = true
  publish = false

  [[collection.document]]
  id = "qspec-dossier-q-002"
  type = "qspec-dossier"
  source = "Q-002.md"
  pdf = "typst"
  docx = true
  publish = false

  [[collection.document]]
  id = "qspec-dossier-q-003"
  type = "qspec-dossier"
  source = "Q-003.md"
  pdf = "typst"
  docx = true
  publish = false

[[collection]]
slug = "qspec-index"
root = "index"
profile = "en"

  [[collection.document]]
  id = "qspec-index-2026-09"
  type = "qspec-index"
  source = "2026-09.md"
  publish = false

[internal]
files = []
reason = "QSPEC dossiers are process records; render them with `paperforge all --draft`"
