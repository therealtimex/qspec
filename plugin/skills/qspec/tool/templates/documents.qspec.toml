# Paperforge project for the QSPEC documents rendered by `qspec render`.
# Committee sheets and Indexes are declared unpublished documents. Dossiers
# are process records under [internal], never document types.
[defaults]
profile = "en"
organisation = "RealTimeX"
publisher = "RealTimeX Research"
paper = "A4"

[types.qspec-sheet]
layout = "brief"
bibliography = "references.bib"
citation_style = "apa"
pdf = "typst"
publish = false

[types.qspec-index]
layout = "brief"
publish = false

[[collection]]
slug = "qspec-index"
root = "index"
profile = "en"

  [[collection.document]]
  id = "qspec-index-2026-09"
  type = "qspec-index"
  source = "2026-09.md"
  publish = false

[internal]
files = ["dossiers/Q-001.md", "dossiers/Q-002.md", "dossiers/Q-003.md"]
reason = "process records: runs, review notes, decisions"
