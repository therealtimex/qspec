# Question Spec instance. Core: QSPEC-CORE.md. Overlay: QSPEC-ENG.md.
# Lint: qspec lint this-file.yaml   Sign: qspec sign this-file.yaml --by <reviewer>
spec_schema: QSPEC/1.0
domain: engineering
id: Q-000
title: ""
status: draft
instance_version: 1
date: YYYY-MM-DD
owner: ""
reviewers: []
changelog:
  - version: 1
    date: YYYY-MM-DD
    change: "created"

claim:
