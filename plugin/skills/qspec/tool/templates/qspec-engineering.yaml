  comparative: false
  system: ""
  artifact_or_process: ""
  operating_regime: ""
  metric: ""             # required unless method_family is theoretical
  why_it_matters: ""

question_type:
  method_family: ""      # experimental | observational_or_field | computational | design_and_analysis | measurement | theoretical
  knowledge_goal: ""     # performance | tradeoff | reliability_or_safety | mechanism_of_failure | feasibility | prediction | measurement
  secondary_method: null
  rescue_rule: null

increment:
  closest_work:
    - cite: ""
      key: ""              # must resolve in references.bib
      settled: ""
      still_open: ""
    - cite: ""
      key: ""              # must resolve in references.bib
      settled: ""
      still_open: ""
    - cite: ""
      key: ""              # must resolve in references.bib
      settled: ""
      still_open: ""
  increment_if_this_works: ""
  vehicle_is_not_the_contribution: ""

materials:
  in_hand: []
  blocking: []           # string, or object: {item, access, locator, coverage, evidence}
  obtainable: []         # object also has source, horizon, probability; access: open_download | on_request | purchase | scrape | partner | unknown
  access_risk: low

success_and_failure:
  support_would_look_like: ""
  failure_would_look_like: ""
  uninteresting_even_if_true: ""
  kill_condition: ""

constraints:
  safety_or_ethics: []   # human_users | animals | hazardous_operation | dual_use | field_deployment | export_control
  sensitivity: ""
  independence_limits: ""
  standards_or_codes: ""

ask:                   # shown on the selection sheet; a hole is reported, never filled
  time: ""
  people: ""
  access: ""
  hardware_or_compute: ""

hints:
  ceiling: unclear
  build_risk: medium
  scale: system

# Replace with the profile for your method_family. See QSPEC-ENG.md section 4.
profile:
  name: experimental
  intervention_or_design_under_test: ""
  baseline: ""
  workload_or_excitation: ""
  metrics: []
  measurement_chain: ""
  controls_and_repeats: ""
  main_artifact_or_confound: ""
  precommitted_checks: []
  threats_to_validity:
    - threat: ""         # baseline_fairness | workload_validity | measurement_error | configuration_drift | benchmark_overfitting
      why_it_applies: ""
      response: ""
      check: null         # optional: one-based precommitted_checks index or exact check text

handoff:
  first_check: ""
  notes_for_next_stage: ""
